[project]
name = "instrumented-holo-server"
version = "0.1.0"
description = "OpenAI-compatible, attention-tracing local server for Holo-3.1-4B"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.0",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pillow>=10",
  "torchvision>=0.26.0",
  "transformers>=5.0.0",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
instrumented-holo-server = "instrumented_holo.app:main"
holo-causal-experiment = "instrumented_holo.causal_experiment:main"
holo-gpu-doctor = "instrumented_holo.gpu_doctor:main"
holo-activation-patch = "instrumented_holo.patching_cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instrumented_holo"]
